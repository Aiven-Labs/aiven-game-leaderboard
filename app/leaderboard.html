<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inkless Game Leaderboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="/assets/aquarium-dark.css">
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--aq-font);
            margin: 0;
            padding: var(--aq-space-6);
            background: var(--aq-bg-body);
            color: var(--aq-text-default);
            min-height: 100vh;
            line-height: 1.42;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: var(--aq-space-8);
        }
        
        /* Larger than Aquarium's 26px large-heading: this board is read from across a room */
        .header h1 {
            margin: 0 0 var(--aq-space-3);
            font-size: clamp(26px, 4vw, 40px);
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--aq-text-default);
        }
        
        .header p {
            margin: var(--aq-space-3) 0 0 0;
            color: var(--aq-text-muted);
            font-size: var(--aq-fs-subheading);
            font-weight: 400;
        }
        
        .leaderboard {
            background: var(--aq-bg-layer);
            border-radius: var(--aq-radius-lg);
            overflow: hidden;
            border: 1px solid var(--aq-border-muted);
        }
        
        .leaderboard-header {
            display: grid;
            grid-template-columns: 60px 1fr 150px 120px 120px 150px;
            gap: var(--aq-space-5);
            padding: var(--aq-space-4) var(--aq-space-6);
            background: var(--aq-bg-layer);
            color: var(--aq-text-muted);
            border-bottom: 1px solid var(--aq-border-default);
            font-weight: 500;
            font-size: var(--aq-fs-small);
        }
        
        .leaderboard-row {
            display: grid;
            grid-template-columns: 60px 1fr 150px 120px 120px 150px;
            gap: var(--aq-space-5);
            padding: var(--aq-space-5) var(--aq-space-6);
            background: var(--aq-bg-layer);
            border-bottom: 1px solid var(--aq-border-muted);
            font-size: var(--aq-fs-large);
            transition: background 0.15s ease;
            align-items: center;
        }
        
        .leaderboard-row:hover {
            background: var(--aq-bg-hover);
        }
        
        .leaderboard-row:last-child {
            border-bottom: none;
        }
        
        .rank {
            font-weight: 700;
            font-size: 1.2em;
            text-align: center;
        }
        
        .rank.top-3 {
            font-size: 1.5em;
        }
        
        .rank-1 { color: var(--aq-warning); }
        .rank-2 { color: var(--aq-rank-2); }
        .rank-3 { color: var(--aq-rank-3); }
        
        .nickname {
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--aq-text-default);
        }
        
        .company {
            color: var(--aq-text-subtle);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.9em;
        }
        
        .savings {
            font-weight: 700;
            color: var(--aq-success);
            text-align: right;
            font-size: 1.1em;
        }
        
        .bill {
            color: var(--aq-danger);
            text-align: right;
            font-weight: 500;
        }
        
        .date {
            font-size: 0.85em;
            color: var(--aq-text-subtle);
            text-align: right;
        }
        
        .loading {
            text-align: center;
            padding: 60px;
            font-size: 1.1em;
            color: var(--aq-text-muted);
        }
        
        .error {
            text-align: center;
            padding: 40px;
            color: var(--aq-danger);
            background: var(--aq-danger-surface);
            border: 1px solid var(--aq-danger-border);
            border-radius: var(--aq-radius-lg);
            margin: 20px;
        }
        
        .no-scores {
            text-align: center;
            padding: 60px;
            color: var(--aq-primary-text);
            font-size: 1.2em;
            font-weight: 500;
        }
        
        /* Aquarium secondary button; base styles come from aquarium-dark.css */
        .refresh-btn {
            display: flex;
            margin: var(--aq-space-7) auto 0;
        }
        
        @media (max-width: 1024px) {
            .leaderboard-header,
            .leaderboard-row {
                grid-template-columns: 50px 1fr 120px 100px 100px;
                gap: 10px;
                padding: 15px;
                font-size: 0.85em;
            }
            
            .date, .date-header {
                display: none;
            }
        }
        
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            
            .leaderboard-header,
            .leaderboard-row {
                grid-template-columns: 50px 1fr 80px 80px;
                gap: 10px;
                padding: 15px 10px;
                font-size: 0.8em;
            }
            
            .date, .company, .date-header, .company-header {
                display: none;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .header p {
                font-size: 1em;
            }
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 0 0 18px;
        }
        .filter-btn {
            background: var(--aq-bg-raised);
            color: var(--aq-text-muted);
            border: 1px solid var(--aq-border-default);
            border-radius: var(--aq-radius);
            min-height: 32px;
            padding: var(--aq-space-2) var(--aq-space-4);
            font-size: var(--aq-fs-default);
            font-weight: 500;
            cursor: pointer;
        }
        .filter-btn:hover {
            background: var(--aq-bg-hover);
            border-color: var(--aq-border-intense);
        }
        .event-select {
            max-width: 100%;
            background: var(--aq-bg-raised);
            color: var(--aq-text-default);
            border: 1px solid var(--aq-border-default);
            border-radius: var(--aq-radius);
            min-height: 32px;
            padding: var(--aq-space-2) var(--aq-space-4);
            font-size: var(--aq-fs-default);
        }
        /* Aquarium ChoiceChip, selected */
        .filter-btn.active {
            background: var(--aq-primary-surface);
            border-color: var(--aq-primary);
            color: var(--aq-primary-text);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Leaderboard</h1>
            <p>Top players who saved the most on their Kafka bills!</p>
        </div>
        
        <div class="filters" role="group" aria-label="Filter scores by where they were played">
            <button class="filter-btn" data-source="all" onclick="setSource('all')">All</button>
            <button class="filter-btn" data-source="arcade" onclick="setSource('arcade')">Arcade</button>
            <button class="filter-btn" data-source="web" onclick="setSource('web')">Web</button>
            <select id="game-select" class="event-select" aria-label="Game" onchange="setGame(this.value)" style="display:none"></select>
            <select id="event-select" class="event-select" aria-label="Event" onchange="setEvent(this.value)">
                <option value="all">All events</option>
            </select>
        </div>

        <div class="leaderboard">
            <div id="loading" class="loading">
                Loading leaderboard...
            </div>
            
            <div id="content" style="display: none;">
                <div class="leaderboard-header">
                    <div>Rank</div>
                    <div>Player</div>
                    <div class="company-header">Company</div>
                    <div id="h-score">Saved</div>
                    <div id="h-secondary">Final Bill</div>
                    <div class="date-header">Date</div>
                </div>
                <div id="leaderboard-data"></div>
            </div>
            
            <div id="error" style="display: none;" class="error">
                Failed to load leaderboard. Please try again.
            </div>
        </div>
        
        <button class="refresh-btn secondary" onclick="loadLeaderboard()">
            Refresh
        </button>
    </div>

    <script>
        let API_BASE_URL = window.location.origin;
        
        // If this HTML is served from a different domain than your API,
        // uncomment and set the correct API URL:
        // API_BASE_URL = 'https://your-api-domain.com';

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { 
                month: 'short', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function getRankClass(rank) {
            if (rank === 1) return 'rank-1';
            if (rank === 2) return 'rank-2';
            if (rank === 3) return 'rank-3';
            return '';
        }

        function getRankDisplay(rank) {
            if (rank === 1) return '🥇';
            if (rank === 2) return '🥈';
            if (rank === 3) return '🥉';
            return `#${rank}`;
        }

        // Which scores to show: all, arcade (the cabinet) or web. The embedding page can
        // preselect with ?source=arcade; otherwise the last choice is remembered.
        const SOURCES = ['all', 'arcade', 'web'];
        let currentSource = (function () {
            const fromUrl = new URLSearchParams(window.location.search).get('source');
            if (SOURCES.indexOf(fromUrl) !== -1) return fromUrl;
            try {
                const saved = window.localStorage.getItem('leaderboardSource');
                if (SOURCES.indexOf(saved) !== -1) return saved;
            } catch (e) { /* storage unavailable */ }
            return 'all';
        })();

        // Which game's board. Defaults to Disk Invaders; ?game=<slug> picks another. The picker only
        // appears once the service has more than one game.
        let currentGame = (function () {
            const fromUrl = new URLSearchParams(window.location.search).get('game');
            return fromUrl && /^[a-z0-9][a-z0-9-]{0,39}$/.test(fromUrl) ? fromUrl : 'disk-invaders';
        })();
        let gameList = [];

        async function loadGames() {
            const select = document.getElementById('game-select');
            try {
                const res = await fetch(`${API_BASE_URL}/api/v1/games`);
                if (res.ok) {
                    gameList = (await res.json()).games;
                    select.innerHTML = '';
                    gameList.forEach(function (g) {
                        const opt = document.createElement('option');
                        opt.value = g.slug;
                        opt.textContent = g.name;
                        select.appendChild(opt);
                    });
                    select.style.display = gameList.length > 1 ? '' : 'none';
                    if (!gameList.some(function (g) { return g.slug === currentGame; }) && gameList.length) {
                        currentGame = gameList[0].slug;
                    }
                    select.value = currentGame;
                }
            } catch (e) { /* stays on the default game */ }
        }

        function setGame(game) {
            currentGame = game;
            renderEventOptions();
            const url = new URL(window.location.href);
            url.searchParams.set('game', game);
            if (currentEvent === 'all') url.searchParams.delete('event'); else url.searchParams.set('event', currentEvent);
            window.history.replaceState(null, '', url);
            loadLeaderboard();
        }

        // Which event's board: "all", "none" (no event) or an event slug. ?event=pgconf-2026 links
        // straight to one event's board, which is what booths and slide-deck QR codes use.
        let currentEvent = (function () {
            const fromUrl = new URLSearchParams(window.location.search).get('event');
            return fromUrl && /^(all|none|[a-z0-9][a-z0-9-]{0,39})$/.test(fromUrl) ? fromUrl : 'all';
        })();

        let eventList = [];

        // The picker only offers events that run the current game
        function renderEventOptions() {
            const select = document.getElementById('event-select');
            select.innerHTML = '';
            const add = function (value, label) {
                const opt = document.createElement('option');
                opt.value = value;
                opt.textContent = label;
                select.appendChild(opt);
            };
            add('all', 'All events');
            eventList
                .filter(function (e) { return !e.games || e.games.includes(currentGame); })
                .forEach(function (e) { add(e.slug, e.name); });
            add('none', 'No event');
            select.value = currentEvent;
            if (select.value !== currentEvent) { currentEvent = 'all'; select.value = 'all'; }
        }

        async function loadEvents() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/events`);
                if (res.ok) {
                    eventList = (await res.json()).events;
                    // Heading names the event when one is chosen
                    window.__eventNames = Object.fromEntries(eventList.map(function (e) { return [e.slug, e.name]; }));
                }
            } catch (e) { /* picker just stays on "All events" */ }
            renderEventOptions();
        }

        function setEvent(event) {
            currentEvent = event;
            const url = new URL(window.location.href);
            if (event === 'all') url.searchParams.delete('event'); else url.searchParams.set('event', event);
            window.history.replaceState(null, '', url);
            loadLeaderboard();
        }

        function updateHeading() {
            const names = window.__eventNames || {};
            const h1 = document.querySelector('.header h1');
            const game = gameList.find(function (g) { return g.slug === currentGame; });
            const parts = [];
            if (names[currentEvent]) parts.push(names[currentEvent]);
            if (gameList.length > 1 && game) parts.push(game.name);
            if (h1) h1.textContent = (parts.length ? parts.join(' \u00B7 ') + ' ' : '') + 'Leaderboard';
        }

        function updateFilterButtons() {
            document.querySelectorAll('.filter-btn').forEach(function (b) {
                b.classList.toggle('active', b.dataset.source === currentSource);
            });
        }

        function setSource(source) {
            currentSource = source;
            try { window.localStorage.setItem('leaderboardSource', source); } catch (e) { /* ignore */ }
            updateFilterButtons();
            loadLeaderboard();
        }

        async function loadLeaderboard() {
            updateFilterButtons();
            updateHeading();
            const loading = document.getElementById('loading');
            const content = document.getElementById('content');
            const error = document.getElementById('error');
            const leaderboardData = document.getElementById('leaderboard-data');

            // Show loading state
            loading.style.display = 'block';
            content.style.display = 'none';
            error.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE_URL}/api/leaderboard?limit=20&source=${currentSource}&event=${currentEvent}&game=${currentGame}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                
                // Column titles follow the game ("Saved" / "Final bill" for Disk Invaders, a time or points elsewhere)
                if (data.game) {
                    // The Kafka-bill tagline is Disk Invaders'; other games get a neutral one
                    const sub = document.querySelector('.header p');
                    if (sub) sub.textContent = data.game.slug === 'disk-invaders'
                        ? 'Top players who saved the most on their Kafka bills!' : 'Top players';
                    document.getElementById('h-score').textContent = data.game.score_label;
                    document.getElementById('h-secondary').textContent = data.game.secondary_label || '';
                }

                if (!data.leaderboard || data.leaderboard.length === 0) {
                    leaderboardData.innerHTML = '<div class="no-scores">No scores claimed yet' + (currentSource === 'all' ? '' : ' for ' + currentSource) + '. Be the first!</div>';
                } else {
                    leaderboardData.innerHTML = data.leaderboard.map(score => `
                        <div class="leaderboard-row">
                            <div class="rank ${score.rank <= 3 ? 'top-3 ' + getRankClass(score.rank) : ''}">${getRankDisplay(score.rank)}</div>
                            <div class="nickname">${escapeHtml(score.nickname)}</div>
                            <div class="company">${score.company ? escapeHtml(score.company) : '—'}</div>
                            <div class="savings">${escapeHtml(score.score_display || score.total_savings || '')}</div>
                            <div class="bill">${escapeHtml(score.secondary_display || '—')}</div>
                            <div class="date">${formatDate(score.timestamp)}</div>
                        </div>
                    `).join('');
                }

                loading.style.display = 'none';
                content.style.display = 'block';

            } catch (err) {
                console.error('Error loading leaderboard:', err);
                loading.style.display = 'none';
                error.style.display = 'block';
                error.innerHTML = `
                    <div class="error">
                        Failed to load leaderboard.<br>
                        <small>Error: ${err.message}</small>
                    </div>
                `;
            }
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Load leaderboard on page load
        document.addEventListener('DOMContentLoaded', function () { Promise.all([loadGames(), loadEvents()]).then(function () { renderEventOptions(); loadLeaderboard(); }); });

        // Auto-refresh every 30 seconds
        setInterval(loadLeaderboard, 30000);
    </script>
</body>
</html>
