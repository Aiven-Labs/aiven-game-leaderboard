<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inkless Game Leaderboard</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
        }
        
        .header p {
            margin: 10px 0 0 0;
            color: #cccccc;
            font-size: 1.2em;
            font-weight: 400;
        }
        
        .leaderboard {
            background: #111111;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333333;
        }
        
        .leaderboard-header {
            display: grid;
            grid-template-columns: 60px 1fr 150px 120px 120px 150px;
            gap: 15px;
            padding: 20px;
            background: #FF6B35;
            color: #000000;
            font-weight: 600;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .leaderboard-row {
            display: grid;
            grid-template-columns: 60px 1fr 150px 120px 120px 150px;
            gap: 15px;
            padding: 20px;
            background: #222222;
            border-bottom: 1px solid #333333;
            transition: background 0.2s ease;
            align-items: center;
        }
        
        .leaderboard-row:hover {
            background: #2a2a2a;
        }
        
        .leaderboard-row:last-child {
            border-bottom: none;
        }
        
        .rank {
            font-weight: 700;
            font-size: 1.2em;
            text-align: center;
        }
        
        .rank.top-3 {
            font-size: 1.5em;
        }
        
        .rank-1 { color: #FFD700; }
        .rank-2 { color: #C0C0C0; }
        .rank-3 { color: #CD7F32; }
        
        .nickname {
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #ffffff;
        }
        
        .company {
            color: #999999;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.9em;
        }
        
        .savings {
            font-weight: 700;
            color: #4CAF50;
            text-align: right;
            font-size: 1.1em;
        }
        
        .bill {
            color: #FF6B6B;
            text-align: right;
            font-weight: 500;
        }
        
        .date {
            font-size: 0.85em;
            color: #888888;
            text-align: right;
        }
        
        .loading {
            text-align: center;
            padding: 60px;
            font-size: 1.1em;
            color: #cccccc;
        }
        
        .error {
            text-align: center;
            padding: 40px;
            color: #FF6B6B;
            background: #1a0000;
            border: 1px solid #FF6B6B;
            border-radius: 8px;
            margin: 20px;
        }
        
        .no-scores {
            text-align: center;
            padding: 60px;
            color: #FF6B35;
            font-size: 1.2em;
            font-weight: 500;
        }
        
        .refresh-btn {
            background: #FF6B35;
            border: none;
            color: #000000;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.2s ease;
            margin: 30px auto 0;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .refresh-btn:hover {
            background: #e55a2b;
            transform: translateY(-1px);
        }
        
        .refresh-btn:active {
            transform: translateY(0);
        }
        
        @media (max-width: 1024px) {
            .leaderboard-header,
            .leaderboard-row {
                grid-template-columns: 50px 1fr 120px 100px 100px;
                gap: 10px;
                padding: 15px;
                font-size: 0.85em;
            }
            
            .date, .date-header {
                display: none;
            }
        }
        
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            
            .leaderboard-header,
            .leaderboard-row {
                grid-template-columns: 50px 1fr 80px 80px;
                gap: 10px;
                padding: 15px 10px;
                font-size: 0.8em;
            }
            
            .date, .company, .date-header, .company-header {
                display: none;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .header p {
                font-size: 1em;
            }
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 0 0 18px;
        }
        .filter-btn {
            background: #1a1a1a;
            color: #cccccc;
            border: 1px solid #444444;
            border-radius: 999px;
            padding: 8px 18px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
        }
        .event-select {
            max-width: 100%;
            background: #1a1a1a;
            color: #ffffff;
            border: 1px solid #444444;
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 14px;
            font-family: inherit;
        }
        .filter-btn.active {
            background: #FF6B35;
            border-color: #FF6B35;
            color: #000000;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 Leaderboard</h1>
            <p>Top players who saved the most on their Kafka bills!</p>
        </div>
        
        <div class="filters" role="group" aria-label="Filter scores by where they were played">
            <button class="filter-btn" data-source="all" onclick="setSource('all')">All</button>
            <button class="filter-btn" data-source="arcade" onclick="setSource('arcade')">Arcade</button>
            <button class="filter-btn" data-source="web" onclick="setSource('web')">Web</button>
            <select id="event-select" class="event-select" aria-label="Event" onchange="setEvent(this.value)">
                <option value="all">All events</option>
            </select>
        </div>

        <div class="leaderboard">
            <div id="loading" class="loading">
                Loading leaderboard...
            </div>
            
            <div id="content" style="display: none;">
                <div class="leaderboard-header">
                    <div>Rank</div>
                    <div>Player</div>
                    <div class="company-header">Company</div>
                    <div>Saved</div>
                    <div>Final Bill</div>
                    <div class="date-header">Date</div>
                </div>
                <div id="leaderboard-data"></div>
            </div>
            
            <div id="error" style="display: none;" class="error">
                Failed to load leaderboard. Please try again.
            </div>
        </div>
        
        <button class="refresh-btn" onclick="loadLeaderboard()">
            🔄 Refresh
        </button>
    </div>

    <script>
        let API_BASE_URL = window.location.origin;
        
        // If this HTML is served from a different domain than your API,
        // uncomment and set the correct API URL:
        // API_BASE_URL = 'https://your-api-domain.com';

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { 
                month: 'short', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function getRankClass(rank) {
            if (rank === 1) return 'rank-1';
            if (rank === 2) return 'rank-2';
            if (rank === 3) return 'rank-3';
            return '';
        }

        function getRankDisplay(rank) {
            if (rank === 1) return '🥇';
            if (rank === 2) return '🥈';
            if (rank === 3) return '🥉';
            return `#${rank}`;
        }

        // Which scores to show: all, arcade (the cabinet) or web. The embedding page can
        // preselect with ?source=arcade; otherwise the last choice is remembered.
        const SOURCES = ['all', 'arcade', 'web'];
        let currentSource = (function () {
            const fromUrl = new URLSearchParams(window.location.search).get('source');
            if (SOURCES.indexOf(fromUrl) !== -1) return fromUrl;
            try {
                const saved = window.localStorage.getItem('leaderboardSource');
                if (SOURCES.indexOf(saved) !== -1) return saved;
            } catch (e) { /* storage unavailable */ }
            return 'all';
        })();

        // Which event's board: "all", "none" (no event) or an event slug. ?event=pgconf-2026 links
        // straight to one event's board, which is what booths and slide-deck QR codes use.
        let currentEvent = (function () {
            const fromUrl = new URLSearchParams(window.location.search).get('event');
            return fromUrl && /^(all|none|[a-z0-9][a-z0-9-]{0,39})$/.test(fromUrl) ? fromUrl : 'all';
        })();

        async function loadEvents() {
            const select = document.getElementById('event-select');
            try {
                const res = await fetch(`${API_BASE_URL}/api/events`);
                if (res.ok) {
                    const { events } = await res.json();
                    events.forEach(function (e) {
                        const opt = document.createElement('option');
                        opt.value = e.slug;
                        opt.textContent = e.name;
                        select.appendChild(opt);
                    });
                    const noEvent = document.createElement('option');
                    noEvent.value = 'none';
                    noEvent.textContent = 'No event';
                    select.appendChild(noEvent);
                    // Heading names the event when one is chosen
                    window.__eventNames = Object.fromEntries(events.map(function (e) { return [e.slug, e.name]; }));
                }
            } catch (e) { /* picker just stays on "All events" */ }
            select.value = currentEvent;
            if (select.value !== currentEvent) { currentEvent = 'all'; select.value = 'all'; }
        }

        function setEvent(event) {
            currentEvent = event;
            const url = new URL(window.location.href);
            if (event === 'all') url.searchParams.delete('event'); else url.searchParams.set('event', event);
            window.history.replaceState(null, '', url);
            loadLeaderboard();
        }

        function updateHeading() {
            const names = window.__eventNames || {};
            const h1 = document.querySelector('.header h1');
            if (h1) h1.textContent = '\u{1F3C6} ' + (names[currentEvent] ? names[currentEvent] + ' Leaderboard' : 'Leaderboard');
        }

        function updateFilterButtons() {
            document.querySelectorAll('.filter-btn').forEach(function (b) {
                b.classList.toggle('active', b.dataset.source === currentSource);
            });
        }

        function setSource(source) {
            currentSource = source;
            try { window.localStorage.setItem('leaderboardSource', source); } catch (e) { /* ignore */ }
            updateFilterButtons();
            loadLeaderboard();
        }

        async function loadLeaderboard() {
            updateFilterButtons();
            updateHeading();
            const loading = document.getElementById('loading');
            const content = document.getElementById('content');
            const error = document.getElementById('error');
            const leaderboardData = document.getElementById('leaderboard-data');

            // Show loading state
            loading.style.display = 'block';
            content.style.display = 'none';
            error.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE_URL}/api/leaderboard?limit=20&source=${currentSource}&event=${currentEvent}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                
                if (!data.leaderboard || data.leaderboard.length === 0) {
                    leaderboardData.innerHTML = '<div class="no-scores">No scores claimed yet' + (currentSource === 'all' ? '' : ' for ' + currentSource) + '. Be the first!</div>';
                } else {
                    leaderboardData.innerHTML = data.leaderboard.map(score => `
                        <div class="leaderboard-row">
                            <div class="rank ${score.rank <= 3 ? 'top-3 ' + getRankClass(score.rank) : ''}">${getRankDisplay(score.rank)}</div>
                            <div class="nickname">${escapeHtml(score.nickname)}</div>
                            <div class="company">${score.company ? escapeHtml(score.company) : '—'}</div>
                            <div class="savings">${score.total_savings}</div>
                            <div class="bill">${score.final_bill}</div>
                            <div class="date">${formatDate(score.timestamp)}</div>
                        </div>
                    `).join('');
                }

                loading.style.display = 'none';
                content.style.display = 'block';

            } catch (err) {
                console.error('Error loading leaderboard:', err);
                loading.style.display = 'none';
                error.style.display = 'block';
                error.innerHTML = `
                    <div class="error">
                        Failed to load leaderboard.<br>
                        <small>Error: ${err.message}</small>
                    </div>
                `;
            }
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Load leaderboard on page load
        document.addEventListener('DOMContentLoaded', function () { loadEvents().then(loadLeaderboard); });

        // Auto-refresh every 30 seconds
        setInterval(loadLeaderboard, 30000);
    </script>
</body>
</html>
